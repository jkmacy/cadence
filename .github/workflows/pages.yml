name: Test and publish Cadence
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Squint compiler
        run: npm install --no-audit --no-fund
      - name: Test Lisp scheduling logic
        run: npm test
      - name: Compile ClojureScript for browsers
        run: npm run build
      - name: Verify generated browser entry point
        run: |
          test -s public/js/cadence/app.mjs
          test -s public/js/cadence/model.mjs
          test -s public/js/squint-cljs/core.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
